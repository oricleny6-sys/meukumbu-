<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Kumbu</title>
<style>
body{background:#4F6EF7;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:white;padding:25px;border-radius:20px;width:310px;text-align:center;box-shadow:0 10px 20px rgba(0,0,0,0.2)}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}
button{width:100%;padding:12px;background:#4F6EF7;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2 style="color:#4F6EF7">Meu Kumbu</h2>
<input id="usuario" placeholder="Usuário" value="admin">
<input id="senha" type="password" placeholder="Senha" value="1234">
<button onclick="entrar()">Entrar</button>
<p id="msg" style="color:red"></p>
</div>
<script>
function entrar(){
let u=document.getElementById("usuario").value;
let s=document.getElementById("senha").value;
if(u=="admin" && s=="1234"){window.location.href="painel.html"}
else{document.getElementById("msg").innerHTML="Usuário ou senha errada!"}
}
</script>
</body>
  </html>
